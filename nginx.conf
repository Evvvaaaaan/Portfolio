##############################################################
#  Nginx Config — Portfolio (Single Page App)
#  도메인: yourdomain.com
#  빌드 경로: /var/www/portfolio/build
##############################################################

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # HTTP → HTTPS 리다이렉트 (Let's Encrypt 이후 활성화)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/portfolio/build;
    index index.html;

    # ──────────────────────────────
    # SSL (certbot이 자동으로 채워줌)
    # ──────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ──────────────────────────────
    # 보안 헤더
    # ──────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ──────────────────────────────
    # Gzip 압축
    # ──────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        application/xml+rss image/svg+xml;

    # ──────────────────────────────
    # 정적 에셋 캐싱 (해시 파일명은 1년)
    # ──────────────────────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|svg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ──────────────────────────────
    # React SPA — 모든 경로를 index.html로
    # ──────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ──────────────────────────────
    # 로그
    # ──────────────────────────────
    access_log /var/log/nginx/portfolio_access.log;
    error_log  /var/log/nginx/portfolio_error.log;
}
